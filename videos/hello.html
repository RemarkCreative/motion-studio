<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../brand.css">
<style>
  #stage { position: relative; width: 1920px; height: 1080px; display: grid; place-items: center; }
  #title { font-family: var(--font-display); font-weight: 700; font-size: 120px; letter-spacing: -2px; }
  #bar { position: absolute; left: 50%; top: 640px; height: 8px; width: 600px; margin-left: -300px;
         background: var(--brand-accent); transform-origin: left center; }
</style>
<div id="stage">
  <div id="title">Hello from my studio</div>
  <div id="bar"></div>
</div>
<script>
  window.DURATION = 3;
  window.SIZE = [1920, 1080];

  const clamp = x => Math.min(1, Math.max(0, x));
  const ease = x => 1 - Math.pow(1 - clamp(x), 3); // ease-out cubic
  const title = document.getElementById('title');
  const bar = document.getElementById('bar');

  window.render = t => {
    const a = ease(t / 0.8);              // title rises and fades in over 0-0.8s
    title.style.opacity = a;
    title.style.transform = `translateY(${(1 - a) * 60}px)`;
    bar.style.transform = `scaleX(${ease((t - 0.5) / 0.8)})`; // bar grows 0.5-1.3s
  };
  window.render(0);
</script>
